[package]
name = "smartcaddy"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
calamine = "0.25.0"  # Check for the latest version on crates.io
rppal = "0.13.1"